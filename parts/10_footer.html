    tip:"For unsymmetrical alkanes, Wurtz gives a mixture — not a good synthetic method. Use Corey-House instead."
  },
  acidity:{
    title:"Acidity in Organic Chemistry",
    def:"Ability of a compound to <b>donate a proton (H⁺)</b>. Stronger acid = more stable conjugate base.",
    examples:"Carboxylic acids > Phenol > Alcohols > Water > Alkynes > Ammonia > Alkanes",
    points:["Stability of conjugate base determines acid strength","Resonance stabilisation of –COO⁻ makes carboxylic acids strong","Electron-withdrawing groups (–NO₂, –Cl) increase acidity","Electron-donating groups (–CH₃, –OCH₃) decrease acidity","Acidity order of phenols: p-nitrophenol > phenol > p-cresol"],
    tip:"Compare acidity by comparing stability of conjugate base. More stable base → stronger acid."
  },
  basicity:{
    title:"Basicity of Amines",
    def:"Ability to <b>donate the lone pair on nitrogen</b> to a proton. Depends on availability of lone pair.",
    examples:"Aliphatic amines > NH₃ > Aromatic amines (in aqueous solution)",
    points:["More electron density on N → stronger base","+I groups (alkyl) increase basicity: R₂NH > RNH₂ > NH₃","In water: 2° > 1° > 3° (solvation effect on 3°)","In gas phase: 3° > 2° > 1° (pure inductive effect)","Resonance with ring decreases basicity of aromatic amines"],
    tip:"Basicity in water: (C₂H₅)₂NH > C₂H₅NH₂ > (C₂H₅)₃N > NH₃ > C₆H₅NH₂. Learn this exact order!"
  },
  "steric-effect":{
    title:"Steric Effect",
    def:"The effect of the <b>size/bulk of groups</b> on the rate and course of a reaction. Bulky groups hinder approach of reagents.",
    examples:"tert-Butyl groups block SN2 backside attack; neopentyl halides are extremely slow in SN2",
    points:["SN2 reactivity decreases with increasing steric bulk around the carbon","Bulky bases favour E2 over SN2","Ortho effect in benzoic acid derivatives","Steric strain in molecules affects stability"],
    tip:"3° substrates don't undergo SN2 due to steric hindrance — they go SN1 or E1/E2 instead."
  },
  "leaving-group":{
    title:"Leaving Group",
    def:"A group that <b>departs with the bonding electron pair</b> during a substitution or elimination. Good leaving groups are stable after departure (weak bases).",
    examples:"Best leaving groups: I⁻ > Br⁻ > Cl⁻ > F⁻ > OH₂ (water from protonated alcohol) >> OH⁻, NH₂⁻ (very poor)",
    points:["Weak bases make good leaving groups","Leaving group ability ↑ with size (better charge dispersal)","Tosylate (TsO⁻) is an excellent leaving group","OH⁻ is a terrible leaving group — that's why alcohols need acid catalyst","Protonation converts –OH to –OH₂⁺ (water = good leaving group)"],
    tip:"F⁻ is the worst halide leaving group despite being most electronegative — its small size concentrates charge."
  }
};

/* ================================================================
   SEARCH INDEX (built dynamically from DOM)
   ================================================================ */
let searchIndex = [];

/* ================================================================
   NAVIGATION
   ================================================================ */
function navigateTo(sectionId){
  document.querySelectorAll('.chapter-section').forEach(s=>s.classList.remove('active'));
  const sec=document.getElementById(sectionId);
  if(sec) sec.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  const navItem=document.querySelector('[data-section="'+sectionId+'"]');
  if(navItem) navItem.classList.add('active');
  // close mobile sidebar
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sb-overlay').classList.remove('active');
}

function navigateToTopic(topicId){
  const topic=document.getElementById(topicId);
  if(!topic) return;
  const sec=topic.closest('.chapter-section');
  if(sec){
    navigateTo(sec.id);
    // expand topic if collapsed
    const hdr=topic.querySelector('.topic-header');
    if(hdr && !hdr.classList.contains('expanded')){
      setTimeout(()=>toggleTopic(hdr),100);
    }
    setTimeout(()=>topic.scrollIntoView({behavior:'smooth',block:'start'}),350);
  }
}

/* ================================================================
   TOPIC TOGGLE (expand/collapse)
   ================================================================ */
function toggleTopic(header){
  const content=header.nextElementSibling;
  if(!content) return;
  const isExpanded=header.classList.contains('expanded');
  if(isExpanded){
    content.style.maxHeight=content.scrollHeight+'px';
    requestAnimationFrame(()=>{
      content.style.maxHeight='0';
      content.classList.remove('expanded');
    });
    header.classList.remove('expanded');
  } else {
    header.classList.add('expanded');
    content.classList.add('expanded');
    content.style.maxHeight=content.scrollHeight+'px';
    setTimeout(()=>{content.style.maxHeight='none';},400);
  }
}

/* ================================================================
   REACTION VIEWER
   ================================================================ */
function nextStep(btn){
  const v=btn.closest('.reaction-viewer');
  const steps=v.querySelectorAll('.rv-step');
  const ci=[...steps].findIndex(s=>s.classList.contains('active'));
  if(ci<steps.length-1){steps[ci].classList.remove('active');steps[ci+1].classList.add('active');updateRV(v);}
}
function prevStep(btn){
  const v=btn.closest('.reaction-viewer');
  const steps=v.querySelectorAll('.rv-step');
  const ci=[...steps].findIndex(s=>s.classList.contains('active'));
  if(ci>0){steps[ci].classList.remove('active');steps[ci-1].classList.add('active');updateRV(v);}
}
function updateRV(v){
  const steps=v.querySelectorAll('.rv-step');
  const ci=[...steps].findIndex(s=>s.classList.contains('active'));
  const p=v.querySelector('.rv-prev'),n=v.querySelector('.rv-next'),t=v.querySelector('.rv-st'),d=v.querySelector('.rv-dots');
  if(p)p.disabled=ci===0; if(n)n.disabled=ci===steps.length-1;
  if(t)t.textContent='Step '+(ci+1)+' of '+steps.length;
  if(d){d.innerHTML='';steps.forEach((_,i)=>{const dot=document.createElement('div');dot.className='rv-dot'+(i===ci?' active':'');d.appendChild(dot);});}
}

/* ================================================================
   CONCEPT MODAL
   ================================================================ */
function showConcept(id){
  const c=concepts[id];
  if(!c){console.warn('Concept not found:',id);return;}
  document.getElementById('modal-title').textContent=c.title;
  let h='<p>'+c.def+'</p>';
  if(c.formula) h+='<div class="ms"><h4>Representation</h4><div class="me">'+c.formula+'</div></div>';
  if(c.examples) h+='<div class="ms"><h4>Examples</h4><div class="me">'+c.examples+'</div></div>';
  if(c.points){h+='<div class="ms"><h4>Key Points</h4><ul style="padding-left:16px;">';c.points.forEach(p=>h+='<li style="margin-bottom:4px;">'+p+'</li>');h+='</ul></div>';}
  if(c.tip) h+='<div class="neet-tip" style="margin-top:12px;"><div class="ib-title">🎯 Exam Tip</div>'+c.tip+'</div>';
  document.getElementById('modal-body').innerHTML=h;
  document.getElementById('concept-modal').classList.add('active');
}
function closeModal(){document.getElementById('concept-modal').classList.remove('active');}

/* ================================================================
   SEARCH
   ================================================================ */
function handleSearch(q){
  const r=document.getElementById('search-results');
  if(!q.trim()){r.classList.remove('active');return;}
  const ql=q.toLowerCase();
  const m=searchIndex.filter(i=>i.text.toLowerCase().includes(ql));
  if(m.length>0){
    r.innerHTML=m.slice(0,10).map(i=>'<div class="sr-item" onclick="navigateToTopic(\''+i.tid+'\')"><div>'+i.text+'</div><div class="sr-ch">'+i.ch+'</div></div>').join('');
    r.classList.add('active');
  } else {
    r.innerHTML='<div class="sr-item" style="cursor:default;">No results found</div>';r.classList.add('active');
  }
}

/* ================================================================
   SIDEBAR
   ================================================================ */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sb-overlay').classList.toggle('active');
}
function toggleSubList(id){document.getElementById(id).classList.toggle('expanded');}

/* ================================================================
   DARK MODE
   ================================================================ */
function toggleDark(){
  document.body.classList.toggle('dark-mode');
  const btn=document.querySelector('.dm-toggle');
  btn.textContent=document.body.classList.contains('dark-mode')?'☀️ Light':'🌙 Dark';
}

/* ================================================================
   INIT
   ================================================================ */
document.addEventListener('DOMContentLoaded',()=>{
  // Concept refs
  document.querySelectorAll('.concept-ref').forEach(el=>{
    el.addEventListener('click',()=>showConcept(el.dataset.concept));
  });
  // Nav items
  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click',()=>{
      if(item.dataset.section) navigateTo(item.dataset.section);
      if(item.dataset.toggle) toggleSubList(item.dataset.toggle);
    });
  });
  // Sub nav items
  document.querySelectorAll('.nav-si').forEach(item=>{
    item.addEventListener('click',()=>navigateToTopic(item.dataset.topic));
  });
  // Chapter cards
  document.querySelectorAll('.ch-card').forEach(card=>{
    card.addEventListener('click',()=>navigateTo(card.dataset.section));
  });
  // Modal close
  document.getElementById('concept-modal').addEventListener('click',e=>{
    if(e.target.classList.contains('modal-overlay'))closeModal();
  });
  document.querySelector('.modal-close').addEventListener('click',closeModal);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  // Search close on outside click
  document.addEventListener('click',e=>{
    if(!e.target.closest('.search-box'))document.getElementById('search-results').classList.remove('active');
  });
  // Init reaction viewers
  document.querySelectorAll('.reaction-viewer').forEach(v=>updateRV(v));
  // Build search index
  document.querySelectorAll('.topic-group').forEach(g=>{
    const sec=g.closest('.chapter-section');
    const chT=sec?.querySelector('.ch-title')?.textContent||'';
    const t=g.querySelector('.topic-header h3')?.textContent||'';
    if(g.id && t) searchIndex.push({text:t,tid:g.id,ch:chT});
  });
  // Also add concept names to search
  Object.keys(concepts).forEach(k=>{
    searchIndex.push({text:concepts[k].title,tid:'catalog',ch:'Concept: '+concepts[k].title});
  });
  // Show catalog
  navigateTo('catalog');
});
</script>
